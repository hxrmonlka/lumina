name: Update packages

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'refs/heads/un/test' }}
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update bun2nix lock input
        run: |
          nix flake lock --update-input bun2nix
          git add flake.lock

      - name: Update packages
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Checking Kunai release and development sources"
          python3 .github/scripts/update-kunai.py
          git add -N kunai-bun.nix
          echo "::endgroup::"

          mapfile -t packages < <(
            nix eval --json .#packages.x86_64-linux \
              | jq -r 'keys[]'
          )

          updated=0
          if ! git diff --cached --quiet; then
            updated=1
          fi

          for package in "${packages[@]}"; do
            echo "::group::Checking ${package}"

            case "${package}" in
              kunai|kunai-latest)
                echo "Using the dedicated release/commit updater for ${package}."
                echo "::endgroup::"
                continue
                ;;
            esac

            # Only attempt packages whose derivation exposes a source.
            if ! nix eval --raw ".#packages.x86_64-linux.${package}.src" >/dev/null 2>&1; then
              echo "Skipping ${package}: no source to update."
              echo "::endgroup::"
              continue
            fi

            package_file="modules/packages/${package}.nix"

            if nix run nixpkgs#nix-update -- \
              "${package}" \
              --flake \
              --version=stable; then
              if git diff --quiet -- "${package_file}"; then
                echo "${package} is up to date."
              elif nix build ".#packages.x86_64-linux.${package}" --no-link; then
                git add -- "${package_file}"
                updated=1
              else
                echo "Updated ${package} failed to build; reverting."
                git checkout -- "${package_file}"
              fi
            else
              echo "nix-update could not update ${package}; leaving it unchanged."
              git checkout -- "${package_file}"
            fi

            echo "::endgroup::"
          done

          if ! git diff --quiet -- modules/packages/kunai.nix kunai-bun.nix; then
            if ! nix build \
              .#packages.x86_64-linux.kunai \
              .#packages.x86_64-linux.kunai-latest \
              --no-link; then
              echo "Kunai validation failed; discarding all Kunai updates."
              git checkout -- modules/packages/kunai.nix
              git reset -- flake.lock
              git checkout -- flake.lock
              git checkout -- kunai-bun.nix 2>/dev/null || rm -f kunai-bun.nix
              exit 1
            fi
            git add modules/packages/kunai.nix kunai-bun.nix flake.lock
            updated=1
          fi
          echo "::endgroup::"

          if [ "${updated}" -eq 0 ]; then
            echo "No package updates found."
            exit 0
          fi

      - name: Validate updated flake
        run: nix flake check --no-update-lock-file

      - name: Commit updates to un/test
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "packages: update packages"
          git push origin HEAD:un/test
